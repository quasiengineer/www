<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

  <!-- KaTeX (client-side render of $$..$$ and $..$) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      renderMathInElement(document.body, {delimiters: [{left: "\\[", right: "\\]", display: true}, {left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}, {left: "\\(", right: "\\)", display: false}], throwOnError: false});
    });
  </script>

  <style>
    :root { --fg:#1a1a1a; --bg:#fff; --muted:#666; --accent:#0366d6; --code-bg:#f6f8fa; --border:#e1e4e8; }
    * { box-sizing: border-box; }
    body { margin:0; color:var(--fg); background:var(--bg);
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
           line-height:1.6; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
    header.site { border-bottom:1px solid var(--border); padding-bottom:.75rem; margin-bottom:2rem; }
    header.site a { color:var(--fg); text-decoration:none; font-weight:600; }
    header.site .tag { color:var(--muted); font-weight:400; font-size:.9rem; margin-left:.5rem;}
    a { color: var(--accent); }
    code { background:var(--code-bg); padding:.15em .35em; border-radius:4px;
           font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; font-size:.9em; }
    pre { background:var(--code-bg); padding:1rem; overflow:auto; border-radius:6px; line-height:1.45; }
    pre code { background:none; padding:0; }
    /* Rouge syntax-highlight token colors (code blocks) */
    pre .c, pre .cm, pre .c1, pre .sr, pre .cs { color:#6a737d; }
    pre .k, pre .kc, pre .kd, pre .kn, pre .kp, pre .kr, pre .kt, pre .ow { color:#cf222e; }
    pre .s, pre .s1, pre .s2, pre .se, pre .si, pre .sb, pre .sc, pre .sd { color:#032f62; }
    pre .m, pre .mi, pre .mf, pre .mh, pre .mo, pre .il { color:#005cc5; }
    pre .nf, pre .nc, pre .nn, pre .nx { color:#8250df; }
    pre .nb, pre .bp, pre .vc, pre .vg, pre .vi, pre .vl { color:#005cc5; }
    pre .cp, pre .cpf { color:#005cc5; }
    pre .na { color:#95d80b; }
    pre .o, pre .p { color:#24292e; }
    h1,h2,h3 { line-height:1.25; margin-top:1.8em; margin-bottom:.6em; }
    blockquote { border-left:4px solid var(--border); margin-left:0; padding-left:1rem; color:var(--muted); }
    img { max-width:100%; height:auto; display:block; margin:1.5em auto; }
    table { border-collapse: collapse; }
    .post-meta { color:var(--muted); font-size:.9rem; margin-bottom:1.5rem; }
    .footnotes { font-size:.9rem; color:var(--muted); border-top:1px solid var(--border); margin-top:2rem; padding-top:1rem; }

    /* home page: article cards */
    .posts { display:flex; flex-direction:column; gap:1.25rem; margin-top:1rem; }
    .post-card { display:flex; gap:1.25rem; padding:1rem; border:1px solid var(--border); border-radius:10px; }
    .post-card:hover { border-color:var(--accent); }
    .post-thumb { flex: 0 0 340px; max-width: 42%; }
    .post-thumb img { width:100%; height:200px; object-fit:cover; margin:0; border-radius:8px; display:block; }
    .post-card-body { flex:1; min-width:0; }
    .post-card-title { margin:0 0 .3em; font-size:1.3rem; line-height:1.3; }
    .post-card-title a { color:var(--fg); }
    .post-card-title a:hover { color:var(--accent); }
    .post-card .post-date { color:var(--muted); font-size:.85rem; margin:0 0 .5em; }
    .post-desc { margin:.3em 0 0; }
    @media (max-width:640px) {
      .post-card { flex-direction:column; }
      .post-thumb { flex-basis:auto; max-width:100%; }
      .post-thumb img { height:auto; aspect-ratio:16/9; }
    }
    .back-home { display:inline-block; margin:0; padding:.5rem 1rem; border:1px solid var(--border); border-radius:6px; color:var(--accent); text-decoration:none; }
    .back-home:hover { background:var(--code-bg); }
    .bh-top { margin:0 0 1.25rem; }
    .bh-bottom { margin:2.5rem 0 0; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site">
      <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <span class="tag">{{ site.description }}</span>
    </header>
    {{ content }}
  </div>
</body>
</html>
