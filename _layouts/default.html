<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.title %}{{ page.title }} - {% endif %}{{ site.title }}</title>
  <meta name="description" content="{% if page.description %}{{ page.description }}{% else %}{{ site.description }}{% endif %}">

  <!-- KaTeX (client-side render of $$..$$ and $..$) -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", function () {
      renderMathInElement(document.body, {delimiters: [{left: "$$", right: "$$", display: true}, {left: "$", right: "$", display: false}], throwOnError: false});
    });
  </script>

  <style>
    :root { --fg:#1a1a1a; --bg:#fff; --muted:#666; --accent:#0366d6; --code-bg:#f6f8fa; --border:#e1e4e8; }
    * { box-sizing: border-box; }
    body { margin:0; color:var(--fg); background:var(--bg);
           font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;
           line-height:1.6; }
    .wrap { max-width: 860px; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }
    header.site { border-bottom:1px solid var(--border); padding-bottom:.75rem; margin-bottom:2rem; }
    header.site a { color:var(--fg); text-decoration:none; font-weight:600; }
    header.site .tag { color:var(--muted); font-weight:400; font-size:.9rem; margin-left:.5rem;}
    a { color: var(--accent); }
    code { background:var(--code-bg); padding:.15em .35em; border-radius:4px;
           font-family:ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,monospace; font-size:.9em; }
    pre { background:var(--code-bg); padding:1rem; overflow:auto; border-radius:6px; line-height:1.45; }
    pre code { background:none; padding:0; }
    h1,h2,h3 { line-height:1.25; margin-top:1.8em; margin-bottom:.6em; }
    blockquote { border-left:4px solid var(--border); margin-left:0; padding-left:1rem; color:var(--muted); }
    img { max-width:100%; height:auto; }
    table { border-collapse: collapse; }
    .post-meta { color:var(--muted); font-size:.9rem; margin-bottom:1.5rem; }
    .footnotes { font-size:.9rem; color:var(--muted); border-top:1px solid var(--border); margin-top:2rem; padding-top:1rem; }
  </style>
</head>
<body>
  <div class="wrap">
    <header class="site">
      <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
      <span class="tag">{{ site.description }}</span>
    </header>
    {{ content }}
  </div>
</body>
</html>
